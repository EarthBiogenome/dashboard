<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBP Phase I Progress</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 1rem;
            box-sizing: border-box;
        }

        .progress-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .progress-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .progress-chart {
            display: flex;
            align-items: flex-start;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .progress-label {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #2c3e50;
            min-width: 100px;
            height: 44px;
        }

        .progress-label i {
            font-size: 1.4rem;
            color: #0d7a47;
        }

        .progress-bar-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .progress-bar-wrapper {
            position: relative;
        }

        .progress-bar {
            display: flex;
            height: 44px;
            background: #d8e6de;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
        }

        .progress-completed {
            background: linear-gradient(135deg, #0d7a47 0%, #16a34a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.05rem;
            font-weight: 600;
            transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 0;
            box-shadow: 2px 0 8px rgba(13, 122, 71, 0.3);
            position: relative;
        }

        .progress-completed::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0%, transparent 100%);
            border-radius: 8px 8px 0 0;
        }

        .progress-completed-text {
            white-space: nowrap;
            padding: 0 15px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
        }

        .progress-incomplete {
            background: transparent;
            flex: 1;
        }

        .progress-axis {
            display: flex;
            justify-content: space-between;
            margin-top: 0;
            padding: 0;
            position: relative;
            height: 35px;
        }

        .progress-axis-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, #999 0%, #999 100%);
        }

        .progress-axis-tick {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            transform: translateX(-50%);
            top: 0;
        }

        .progress-axis-tick::before {
            content: '';
            width: 1px;
            height: 8px;
            background-color: #888;
        }

        .progress-axis-label {
            font-size: 0.85rem;
            color: #555;
            font-weight: 500;
            margin-top: 4px;
        }

        @keyframes progressFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress-section {
            animation: progressFadeIn 0.6s ease-out;
        }

        @media (max-width: 768px) {
            .progress-section {
                padding: 1rem;
            }

            .progress-title {
                font-size: 1.2rem;
            }

            .progress-chart {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .progress-label {
                justify-content: flex-start;
            }

            .progress-bar-container {
                width: 100%;
            }

            .progress-bar {
                height: 38px;
            }

            .progress-completed {
                font-size: 0.9rem;
            }

            .progress-axis-label {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="progress-section" id="progress-section">
        <div class="progress-title">EBP Phase I Progress</div>
        <div class="progress-chart">
            <div class="progress-label">
                <i class="fas fa-dna"></i>
                <span>Genomes</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-wrapper">
                    <div class="progress-bar">
                        <div class="progress-completed" id="progress-completed" style="width: 0%;">
                            <span class="progress-completed-text" id="progress-text">Loading...</span>
                        </div>
                        <div class="progress-incomplete" id="progress-incomplete"></div>
                    </div>
                </div>
                <div class="progress-axis" id="progress-axis">
                    <div class="progress-axis-line"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const PHASE_I_GOAL = 10000;
        const SPECIES_API_URL = "https://goat.genomehubs.org/api/v2/search?query=bioproject%3DPRJNA533106%20AND%20tax_rank%28species%29&result=taxon&includeEstimates=true&taxonomy=ncbi&size=1";

        /**
         * Creates axis tick marks from 0 to 10,000
         */
        function createAxisTicks() {
            const axisContainer = document.getElementById('progress-axis');
            const tickValues = [0, 2000, 4000, 6000, 8000, 10000];
            
            tickValues.forEach(value => {
                const tick = document.createElement('div');
                tick.classList.add('progress-axis-tick');
                tick.style.left = `${(value / PHASE_I_GOAL) * 100}%`;
                
                const label = document.createElement('span');
                label.classList.add('progress-axis-label');
                label.textContent = value.toLocaleString();
                tick.appendChild(label);
                
                axisContainer.appendChild(tick);
            });
        }

        /**
         * Fetches species count from GoaT API and updates the progress bar
         */
        async function fetchSpeciesCount() {
            try {
                const response = await fetch(SPECIES_API_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }
                
                const data = await response.json();
                const speciesCount = data.status && data.status.hits ? data.status.hits : 0;
                
                updateProgressBar(speciesCount);
                
            } catch (error) {
                console.error('Error fetching species count:', error);
                document.getElementById('progress-text').textContent = 'Data unavailable';
            }
        }

        /**
         * Updates the progress bar with the species count
         */
        function updateProgressBar(count) {
            const percentage = Math.min((count / PHASE_I_GOAL) * 100, 100);
            const completedBar = document.getElementById('progress-completed');
            const progressText = document.getElementById('progress-text');
            
            completedBar.style.width = `${percentage}%`;
            progressText.textContent = `${count.toLocaleString()} (${percentage.toFixed(1)}%)`;
        }

        function notifyParentHeight() {
            window.parent.postMessage({ iframeHeight: document.body.scrollHeight }, '*');
        }

        // Initialize
        createAxisTicks();
        fetchSpeciesCount().finally(notifyParentHeight);
        window.addEventListener('load', notifyParentHeight);
    </script>
</body>
</html>
