<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Fang Chen" />
    <title>EBP Global Distribution</title>
    <script src="./echarts.min.js"></script>
    <script src="./d3.v6.js"></script>
    <script src="./geoMap/world.zh.js"></script>
    <script src="./geoMap/projectsGeographics.js"></script>
    <!-- <script src="./geoMap/updated_projectsWebsites.js"></script> -->
    <link href="./geoMap/bootstrap.min.css" rel="stylesheet">
    <script src="./geoMap/jquery-3.6.0.min.js"></script>
    <script src="./geoMap/popper.min.js"></script>
    <script src="./geoMap/bootstrap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
        }
        #mapContainer {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #1b2a58;
        }
        #barContainer {
            width: 80vw;
            height: 160vh;
            margin: 60px auto 80px auto;
            overflow: hidden;
        }
        .btns {
            position: absolute;
            right: 20px;
            top: 10px;
            display: flex;
            border-radius: 25px;
            overflow: hidden;
            height: 40px;
            border: 1px solid #000;
            z-index: 99999999;
        }
        .btns button {
            display: inline-flex;
            width: 80px;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
            background-color: #fff;
            outline: none;
        }
        .btns .selected {
            background-color: #aaa;
        }
        #downloadDropdown {
            position: absolute;
            right: 16px;
            bottom: 20px;
            z-index: 99999999;
        }
        #downloadDropdown .dropdown-toggle {
            height: 40px;
            padding: 0 16px;
            border: 1px solid #000;
            border-radius: 25px;
            background-color: #fff;
            cursor: pointer;
            font-size: 13px;
        }
        #downloadDropdown .dropdown-toggle:hover {
            background-color: #eee;
        }
        #downloadDropdown .dropdown-menu {
            min-width: 120px;
            border-radius: 8px;
            font-size: 13px;
        }
        #relationshipGraph {
            width: 766px;
            height: 400px;
        }
        #total {
            position: absolute;
            left: 50px;
            bottom: 50px;
            color: #000;
            font-size: 26px;
        }
        #projectsList {
            height: 500px;
            overflow: auto;
        }
        #projectsList li {
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="btns">
        <button>Map</button>
        <button>Statistic</button>
    </div>
    <div id="downloadDropdown" class="dropdown">
        <button class="dropdown-toggle" data-toggle="dropdown">&#8595; Download Map</button>
        <div class="dropdown-menu dropdown-menu-right">
            <a class="dropdown-item" id="downloadSvgBtn" href="#">SVG (vector)</a>
            <a class="dropdown-item" id="downloadPngBtn" href="#">PNG (high-res)</a>
        </div>
    </div>
    <div id="mapContainer"></div>
    <div id="barContainer"></div>
    <!-- Modal for displaying project list by country -->
    <div class="modal fade" id="relationshipModal" tabindex="-1" aria-labelledby="relationshipModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="relationshipModalLabel">Project Relationships</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="projectsList"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const data = projectsData;
        let mapChartInstance = null;
        
        function initMap (worldJson) {
            // Aggregate projects by address
            const addressMap = {};
            const aggregatedData = data.map(item => {
                const address = item.address
                if(!addressMap[address]) addressMap[address] = 1
                else addressMap[address]++
                const offsetX = addressMap[address] > 1 ? (Math.random() - 0.5) * 2 / 10 : 0
                const offsetY = addressMap[address] > 1 ? (Math.random() - 0.5) * 2 / 10 : 0
                return {
                    name: item.projectName,
                    value: [item.longitude + offsetX, item.latitude + offsetY, addressMap[address]],
                    website: item.website,
                    address: address,
                    isNew: Boolean(item.isNew)
                }
            });

            const colorMap =  [
                "#dbc649", // color code for project headquarters
                "#759f98", // color code for areas samples collected
                "#F28C28",
                "#B0B3B8", // Smoke gray
                "#D4808B", // Golden
                "#708090", // Slate gray
                "#FFD700", // Rose pink
                "#6B8E23", // Bright olive green
                "#191970", // Midnight blue
                "#FFF8E1"  // Light ivory
            ];

            const promiseArr = aggregatedData.sort((a, b) => {
                if(a.isNew) return -1
                else return 1
            }).map(item => {
                if (!item.isNew) {
                    return Promise.resolve({
                        name: item.name,
                        value: item.value,
                        symbol: 'circle',
                        size: 12,
                        color: colorMap[0],
                        ...item
                    });
                }
                return Promise.resolve({
                    name: item.name,
                    value: item.value,
                    symbol: 'circle',
                    size: 10,
                    color: colorMap[1],
                    ...item
                });
            });

            Promise.all(promiseArr).then(arr => {
                const myChart = echarts.init(document.getElementById('mapContainer'), null, { renderer: 'svg' });
                mapChartInstance = myChart;

                // Country list
                const countries = new Set()
                // const projectMap = Object.fromEntries(projectsData.map(project => ([project.projectName, project])))
                const countryNameMap = {
                    "united states": "United States of America",
                    "democratic republic of the congo": "Democratic Republic of the Congo",
                    "türkiye": "Turkey",
                    "czech republic": "Czech Republic",
                    "trinidad": "Trinidad and Tobago",
                    "côte d'ivoire": "Côte d'Ivoire",
                    "bosnia and herzegovina": "Bosnia and Herzegovina",
                    "united republic of tanzania": "Tanzania",
                    "republic of madagascar": "Madagascar",
                }
                projectsData.forEach(project => {
                    if(project.isCenter) return
                    const { address } = project
                    if(!address) return
                    const raw = address.split(', ').at(-1)?.trim() ?? ''
                    if(!raw || /\d/.test(raw)) return
                    const lower = raw.toLowerCase()
                    const country = countryNameMap[lower] || raw
                    countries.add(country)
                })
                
                // Configure the map options
                const option = {
                    tooltip: {
                        trigger: 'item',
                        confine: true,
                        formatter: function (params) {
                            const item = aggregatedData[params.dataIndex]
                            return `Name: ${item.name}<br/>Address: ${item.address}<br/>Website: ${item.website || '-'}`; // Show count
                        }
                    },
                    geo: {
                        map: 'world',
                        roam: true,
                        label: {
                            show: false
                        },
                        itemStyle: {
                            normal: {
                                areaColor: '#f3f3f3',
                                borderColor: '#555'
                            },
                            emphasis: {
                                areaColor: '#ffff00'
                            }
                        },
                        regions: Array.from(countries).map(countryName => (
                            {
                            name: countryName,  // Country name (e.g. "United States")
                            itemStyle: {
                                areaColor: '#759f98' // color code for country presence
                            }
                        }))
                    },
                    series: [{
                        type: 'scatter',
                        coordinateSystem: 'geo',
                        data: arr.map(item => ({
                            name: item.name,
                            value: item.value,
                            label: {
                                show: false,
                                formatter: (a) => {
                                    return a.value[2]
                                }, // Show the count
                                fontSize: 10,
                                // color: '#fff',
                                position: 'inside' // Position the label above the point
                            },
                            symbol: item.symbol,
                            symbolSize: item.size,
                            itemStyle: item.color ? { color: item.color } : undefined
                        })),
                        // symbol: 'image://./geoMap/logo.png',
                        // symbolSize: 25, // Adjust symbol size based on count
                        encode: {
                            tooltip: 0
                        }
                    }],
                    graphic: [{
                        type: 'group',
                        left: 16,
                        top: 'middle',
                        z: 100,
                        children: [
                            {
                                type: 'rect',
                                shape: { x: 0, y: -30, width: 220, height: 58, r: 8 },
                                style: { fill: 'rgba(27, 42, 88, 0.75)' }   
                            },
                            {
                                type: 'circle',
                                shape: { cx: 20, cy: -12, r: 6 },
                                style: { fill: '#dbc649' }
                            },
                            {
                                type: 'text',
                                style: {
                                    x: 34, y: -19,
                                    text: 'Project central operation',
                                    font: '13px sans-serif',
                                    fill: '#e8e8e8',
                                    textBaseline: 'top'
                                }
                            },
                            {
                                type: 'rect',
                                shape: { x: 12, y: 8, width: 16, height: 12, r: 3 },
                                style: { fill: '#759f98' }
                            },
                            {
                                type: 'text',
                                style: {
                                    x: 34, y: 8,
                                    text: 'Country with EBP presence',
                                    font: '13px sans-serif',
                                    fill: '#e8e8e8',
                                    textBaseline: 'top'
                                }
                            }
                        ]
                    }]
                };

                const proj = d3.geoEqualEarth();
                echarts.registerMap('world', worldJson);
                myChart.setOption({
                    ...option,
                    geo: {
                        ...option.geo,
                        projection: {
                            project: (point) => proj(point),
                            unproject: (point) => proj.invert(point)
                        }
                    }
                });

                // Click event to display the relationship diagram
                myChart.on('click', function (params) {
                    if (params.componentType === 'series') {
                        const item = aggregatedData[params.dataIndex]
                        if(item.website) {
                            window.open(item.website, '_blank');
                        } else {
                            window.alert('no website!')
                        }
                    }
                });

                // Build color legend
                // const colorsContainer = document.getElementById('colors');
                // colorMap.forEach((color, index) => {
                //     const colorDiv = document.createElement('div');
                //     colorDiv.className = 'color-box';
                //     colorDiv.style.backgroundColor = color;

                //     const colorName = document.createElement('div');
                //     colorName.className = 'color-name';
                //     colorName.textContent = index + 1;

                //     colorDiv.appendChild(colorName);
                //     colorsContainer.appendChild(colorDiv);
                // });
            })

            function showRelationshipGraph(aggregatedItem) {
                const relationshipGraph = echarts.init(document.getElementById('relationshipGraph'));

                // Prepare graph data
                // const nodes = [{ name: aggregatedItem.name, symbolize: true, symbolSize: 40, category: 0 }];
                const nodes = [{ name: aggregatedItem.name, symbolize: true, symbolSize: 40, category: 0, label: { show: false} }];
                const links = [];

                aggregatedItem.projects.forEach(project => {
                    nodes.push({ name: project.projectName, url: project.website, symbolSize: 30, category: 1 });
                    links.push({ source: aggregatedItem.name, target: project.projectName });
                });

                const graphOption = {
                    tooltip: {},
                    animation: false,
                    series: [{
                        type: 'graph',
                        layout: 'force',
                        data: nodes,
                        links: links,
                        categories: [
                            { name: 'address' },
                            { name: 'project' },
                        ],
                        focusNodeAdjacency: true,
                        roam: true,
                        edgeSymbol: ['circle', 'arrow'],
                        edgeSymbolSize: [4, 10],
                        force: {
                            repulsion: 2000, // increase repulsion distance
                        },
                        label: {
                            show: true,
                            position: 'inside', // Center the labels inside the nodes
                            formatter: params => params.data.name // Show name only for simplicity
                        },
                        lineStyle: {
                            color: 'source',
                            // curveness: 0.3
                        }
                    }]
                };

                relationshipGraph.setOption(graphOption);
                
                relationshipGraph.on('click', function (params) {
                    if (params.data.url) {
                        window.open(params.data.url, '_blank'); // open the link in a new tab
                    } 
                });
            }
        }

        function initBar() {
            const countryProjects = {};
            let count = 0;
            projectsData.forEach(project => {
                if (project.isNew || project.isCenter) return;
                count++;
                const { address } = project;
                if (!address) return;
                const raw = address.split(', ').at(-1) ?? '';
                // Skip if the last segment contains digits (street number / postcode, not a country)
                if (/\d/.test(raw)) return;
                const country = raw.trim().toLowerCase()
                    .split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                if (!country) return;
                if (!countryProjects[country]) {
                    countryProjects[country] = [];
                }
                countryProjects[country].push(project);
            });

            // Sort ascending so largest bar appears at the top
            const sortedArr = Object.entries(countryProjects).sort((a, b) => a[1].length - b[1].length);
            const keys = sortedArr.map(item => item[0]);
            const barData = sortedArr.map(item => item[1].length);

            var myChart = echarts.init(document.getElementById('barContainer'));
            var option = {
                title: {
                    text: `Distribution of ${count} EBP Affiliated Projects by Country`,
                    left: 'center'
                },
                grid: {
                    top: '8%',
                    left: '1%',
                    right: '12%',
                    bottom: '5%',
                    containLabel: true
                },
                tooltip: {},
                xAxis: {
                    type: 'value',
                    name: 'Number of Projects',
                    nameLocation: 'middle',
                    nameGap: 30,
                    nameTextStyle: { fontSize: 14 },
                    splitLine: { show: true },
                    axisLine: { show: true },
                    minInterval: 1
                },
                yAxis: {
                    type: 'category',
                    data: keys,
                    axisLabel: { fontSize: 12 }
                },
                series: [{
                    name: 'Country',
                    type: 'bar',
                    data: barData,
                    itemStyle: { color: '#38aadd' },
                    barWidth: '60%',
                    label: {
                        show: true,
                        position: 'right',
                        fontSize: 12
                    }
                }]
            };

            myChart.setOption(option);

            myChart.on('click', function (params) {
                if (params.componentType === 'series') {
                    const projects = countryProjects[params.name];
                    document.getElementById('relationshipModalLabel').innerText = `${params.name}  (${projects.length})`;
                    const projectsContainer = document.getElementById('projectsList');
                    projectsContainer.innerHTML = projects.map(project => {
                        const { projectName, website } = project;
                        return `<li><a href="${website}" title="${website}" target="_blank">${projectName}</a></li>`;
                    }).join('');
                    $('#relationshipModal').modal('show');
                }
            });
        }

        initMap(worldJson);
        initBar();

        document.querySelectorAll('button').forEach(btn => {
            btn.onclick = e => {
                const type = e.target.innerHTML;
                if (type !== 'Map' && type !== 'Statistic') return;
                document.querySelectorAll('button').forEach(b => { b.className = ''; });
                e.target.className = 'selected';
                const map = document.getElementById('mapContainer');
                const bar = document.getElementById('barContainer');
                const downloadDropdown = document.getElementById('downloadDropdown');
                if (type == 'Map') {
                    map.style.display = 'block';
                    bar.style.display = 'none';
                    downloadDropdown.style.display = 'block';
                } else {
                    map.style.display = 'none';
                    bar.style.display = 'block';
                    downloadDropdown.style.display = 'none';
                }
            };
        });
        document.querySelector('button').click();

        document.getElementById('downloadSvgBtn').onclick = function (e) {
            e.preventDefault();
            if (!mapChartInstance) return;
            const svgEl = mapChartInstance.getDom().querySelector('svg');
            const svgStr = svgEl.outerHTML.replace(
                /(<svg[^>]*>)/,
                '$1<rect width="100%" height="100%" fill="#1b2a58"/>'
            );
            const blob = new Blob([svgStr], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.download = 'EBP_global_distribution.svg';
            a.href = url;
            a.click();
            URL.revokeObjectURL(url);
        };

        document.getElementById('downloadPngBtn').onclick = function (e) {
            e.preventDefault();
            if (!mapChartInstance) return;
            const svgEl = mapChartInstance.getDom().querySelector('svg');
            const svgStr = svgEl.outerHTML.replace(
                /(<svg[^>]*>)/,
                '$1<rect width="100%" height="100%" fill="#1b2a58"/>'
            );
            const img = new Image();
            const blob = new Blob([svgStr], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            img.onload = function () {
                const canvas = document.createElement('canvas');
                canvas.width = img.width * 4;
                canvas.height = img.height * 4;
                const ctx = canvas.getContext('2d');
                ctx.scale(4, 4);
                ctx.drawImage(img, 0, 0);
                const a = document.createElement('a');
                a.download = 'EBP_global_distribution.png';
                a.href = canvas.toDataURL('image/png');
                a.click();
                URL.revokeObjectURL(url);
            };
            img.src = url;
        };

    </script>
</body>
</html>
