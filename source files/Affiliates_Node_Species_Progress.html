    <script>
        let chartInstance1 = null
        let chartInstance2 = null

      // Cache for API responses
      const apiCache = new Map();
      
      // Configuration for API requests
      const API_CONFIG = {
        initialPageSize: 5000,  // Start with smaller size for faster initial load
        maxPageSize: 10000,     // Maximum records per request
        truncationWarningThreshold: 0.95 // Warn if we get >= 95% of requested records
      };

      // Enhanced fetch with caching and error handling
      async function fetchDataWithCache(url, retries = 3) {
        if (apiCache.has(url)) {
          return apiCache.get(url);
        }

        for (let i = 0; i < retries; i++) {
          try {
            const response = await fetch(url);
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            const data = await response.json();
            apiCache.set(url, data);
            return data;
          } catch (error) {
            if (i === retries - 1) throw error;
            await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1))); // Exponential backoff
          }
        }
      }

      // Fetch all data for a project with automatic pagination if needed
      async function fetchAllProjectData(projectId, projectName) {
        let allResults = [];
        let offset = 0;
        let pageSize = API_CONFIG.initialPageSize;
        let hasMoreData = true;
        let totalFetched = 0;

        while (hasMoreData) {
          const searchUrl = `https://goat.genomehubs.org/api/v2/search?query=bioproject%3D${projectId}%20AND%20tax_rank%28species%29&result=taxon&includeEstimates=true&taxonomy=ncbi&size=${pageSize}&offset=${offset}&fields=genome_size%2Cassembly_level%2Cassembly_span`;
          
          try {
            const response = await fetchDataWithCache(searchUrl);
            
            // Debug logging for problematic projects
            if (projectName === 'lmgp') {
              console.log(`🔍 LMGP API Response:`, response);
              console.log(`🔍 LMGP URL:`, searchUrl);
            }
            
            if (response.results && response.results.length > 0) {
              allResults = allResults.concat(response.results);
              totalFetched += response.results.length;
              
              // Check if we might have more data
              if (response.results.length >= pageSize * API_CONFIG.truncationWarningThreshold) {
                // Likely hitting the limit, fetch more
                offset += pageSize;
                // Increase page size for subsequent requests for better efficiency
                pageSize = Math.min(API_CONFIG.maxPageSize, pageSize * 1.5);
              } else {
                hasMoreData = false;
              }
            } else {
              // Log when no results are returned
              if (projectName === 'lmgp') {
                console.warn(`⚠️ LMGP: No results returned from API. Response:`, response);
              }
              hasMoreData = false;
            }
          } catch (error) {
            console.error(`❌ Error fetching data for ${projectName} (${projectId}):`, error);
            console.error(`❌ Failed URL:`, searchUrl);
            // Return empty results instead of failing completely
            return {
              results: [],
              totalFetched: 0,
              projectName: projectName,
              error: error.message
            };
          }

          // Safety check to prevent infinite loops
          if (offset > 50000) {
            console.warn(`${projectName}: Stopped fetching after 50,000 records. Data may be incomplete.`);
            break;
          }
        }

        return {
          results: allResults,
          totalFetched: totalFetched,
          projectName: projectName
        };
      }

      // Show warning for potential data truncation
      function showDataWarning(projects) {
        const warningProjects = projects.filter(p => p.totalFetched >= API_CONFIG.initialPageSize * API_CONFIG.truncationWarningThreshold);
        
        if (warningProjects.length > 0) {
          const warningDiv = document.createElement('div');
          warningDiv.className = 'data-warning';
          warningDiv.innerHTML = `
            <div style="background-color: #fff3cd; border: 1px solid #ffeaa7; border-radius: 4px; padding: 10px; margin: 10px auto; max-width: 800px; font-size: 14px;">
              <strong>📊 Large Dataset Notice:</strong> Some projects have extensive data:
              <ul style="margin: 5px 0; padding-left: 20px;">
                ${warningProjects.map(p => `<li><strong>${p.projectName}:</strong> ${p.totalFetched.toLocaleString()} records loaded</li>`).join('')}
              </ul>
              All available data has been included in the visualization.
            </div>
          `;
          document.querySelector('.container').insertBefore(warningDiv, document.getElementById('chartContainer1'));
        }
      }

      // Show error message
      function showError(containerId, message) {
        const container = document.getElementById(containerId);
        container.innerHTML = `<div class="error-message">Error: ${message}</div>`;
      }

      // Update progress text
      function updateProgress(containerId, text) {
        const container = document.getElementById(containerId);
        const progressText = container.querySelector('.progress-text');
        if (progressText) {
          progressText.textContent = text;
        }
      }

      // Test if a project ID is valid in GoaT
      async function testProjectIdInGoaT(projectId, projectName) {
        try {
          const testUrl = `https://goat.genomehubs.org/api/v2/search?query=bioproject%3D${projectId}&result=taxon&size=1&fields=bioproject`;
          const response = await fetch(testUrl);
          const data = await response.json();
          
          if (data.results && data.results.length > 0) {
            console.log(`✅ ${projectName} (${projectId}): Project found in GoaT`);
            return true;
          } else {
            console.warn(`⚠️ ${projectName} (${projectId}): Project NOT found in GoaT`);
            return false;
          }
        } catch (error) {
          console.error(`❌ ${projectName} (${projectId}): Error testing project ID:`, error);
          return false;
        }
      }

      window.onload = async function () {
        try {
          // Charts will show "Fetching data..." until ready

          // First, try to get categories from GoaT API
          const finalReportUrl = 'https://goat.genomehubs.org/api/v2/report?report=histogram&x=tax_tree%282759%29%20AND%20long_list%20AND%20bioproject%3DPRJNA533106&rank=species&includeEstimates=false&cat=assembly_level%3Dcontig%2Cscaffold%2Cchromosome%2Ccomplete%20genome&xOpts=%2C%2C55%2C%2CEBP%20Affiliate&caption=Assemblies%20available%20on%20INSDC%20for%20target%20species%20across%20EBP-affiliated%20projects.%20Note%20that%20umbrella%20projects%20will%20inherit%20counts%20from%20their%20sub-projects%20and%20that%20overlapping%20targets%20sequenced%20by%20at%20least%20one%20EBP%20affiliate%20will%20appear%20as%20complete%20in%20all%20projects%20targeting%20that%20taxon&taxonomy=ncbi&result=taxon&queryId=vLCkKyxY2S'
          
          let categories = [];
          try {
            const res = await fetchDataWithCache(finalReportUrl);
            categories = res.report.report.histogram.histograms.buckets.filter(item => (!!item));
          } catch (error) {
            console.warn('Failed to fetch categories from GoaT API, using fallback approach:', error);
          }
          
          const projectsToFetch = [];
          const validCategories = [];
          
          // If we got categories from GoaT, use them
          if (categories.length > 0) {
            categories.forEach(projectName => {
              const projectId = projectsList[projectName];
              if(projectId) {
                validCategories.push(projectName);
                projectsToFetch.push({ projectId, projectName });
              }
            });
          }
          
          // Fallback: ensure all projects with IDs from projectsList are included
          if (projectsToFetch.length === 0) {
            console.log('Using fallback: including all projects from projectsList.js');
            Object.entries(projectsList).forEach(([projectName, projectId]) => {
              if (projectId && projectId.trim() !== '') {
                validCategories.push(projectName);
                projectsToFetch.push({ projectId, projectName });
              }
            });
          } else {
            // Add any missing projects from projectsList that weren't returned by GoaT
            Object.entries(projectsList).forEach(([projectName, projectId]) => {
              if (projectId && projectId.trim() !== '' && !validCategories.includes(projectName)) {
                console.log(`Adding missing project: ${projectName} (${projectId})`);
                validCategories.push(projectName);
                projectsToFetch.push({ projectId, projectName });
              }
            });
          }

          // Loading indicators already show "Fetching data..."
          
          // Debug: log which projects are being processed
          console.log('Projects to fetch:', projectsToFetch.map(p => `${p.projectName} (${p.projectId})`));
          console.log('Valid categories:', validCategories);
          
          // Check if lmgp is specifically included
          const lmgpProject = projectsToFetch.find(p => p.projectName === 'lmgp');
          if (lmgpProject) {
            console.log('✅ lmgp project found:', lmgpProject);
            
            // Test if the lmgp project ID is valid in GoaT
            console.log('🔍 Testing lmgp project ID in GoaT...');
            const isLmgpValid = await testProjectIdInGoaT(lmgpProject.projectId, 'lmgp');
            
            if (!isLmgpValid) {
              console.warn('⚠️ LMGP project ID may be incorrect or the project may not exist in GoaT');
            }
          } else {
            console.warn('❌ lmgp project NOT found in projectsToFetch');
            console.log('Available projects:', projectsToFetch.map(p => p.projectName));
          }

          // Pre-initialize data structures
          const speciesCounts = {
            'chromosome': new Array(validCategories.length).fill(0),
            'complete genome': new Array(validCategories.length).fill(0),
            'contig': new Array(validCategories.length).fill(0),
            'scaffold': new Array(validCategories.length).fill(0)
          };
          /* const genomes = {
            'chromosome': new Array(validCategories.length).fill(0),
            'complete genome': new Array(validCategories.length).fill(0),
            'contig': new Array(validCategories.length).fill(0),
            'scaffold': new Array(validCategories.length).fill(0)
          };
          const assemblies = {
            'chromosome': new Array(validCategories.length).fill(0),
            'complete genome': new Array(validCategories.length).fill(0),
            'contig': new Array(validCategories.length).fill(0),
            'scaffold': new Array(validCategories.length).fill(0)
          }; */

          // Fetch all project data with automatic pagination
          const projectPromises = projectsToFetch.map((project, index) => {
            return fetchAllProjectData(project.projectId, project.projectName);
          });

          const results = await Promise.all(projectPromises);
          
          // Show data warning if needed
          showDataWarning(results);
          
          // Log any projects that failed to load
          const failedProjects = results.filter(r => r.error);
          if (failedProjects.length > 0) {
            console.warn('⚠️ Projects with errors:', failedProjects.map(p => `${p.projectName}: ${p.error}`));
          }
          
          // Processing data - indicator already shows "Fetching data..."

          // Optimized data processing
          results.forEach((projectResult, index) => {
            if (projectResult.results) {
              // Debug logging for lmgp
              if (projectResult.projectName === 'lmgp') {
                console.log(`🔍 LMGP processing: ${projectResult.results.length} results, error: ${projectResult.error || 'none'}`);
              }
              
              projectResult.results.forEach(item => {
                const fields = item.result.fields;
                const assemblyLevel = fields.assembly_level;
                
                if (assemblyLevel && assemblyLevel.value) {
                  const level = assemblyLevel.value.toLowerCase();
                  
                  if (speciesCounts.hasOwnProperty(level)) {
                    speciesCounts[level][index]++;
                    // genomes[level][index] += fields.genome_size ? fields.genome_size.value : 0;
                    // assemblies[level][index] += fields.assembly_span ? fields.assembly_span.value : 0;
                  }
                }
              });
            } else {
              // Log when no results are available
              if (projectResult.projectName === 'lmgp') {
                console.warn(`⚠️ LMGP: No results available for processing`);
              }
            }
          });

          // Create chart data structures
          const chartData = [
            {
              data: { report: { report: { yLabel: "Count of Species", histogram: { histograms: { byCat: speciesCounts, buckets: [] } } } } },
              title: 'Count of Species',
              containerId: 'chartContainer1'
            }
            /* ,
            {
              data: { report: { report: { yLabel: "Sum of genome_size", histogram: { histograms: { byCat: genomes, buckets: [] } } } } },
              title: 'Sum of genome_size',
              containerId: 'chartContainer2'
            },
            {
              data: { report: { report: { yLabel: "Sum of assembly_span", histogram: { histograms: { byCat: assemblies, buckets: [] } } } } },
              title: 'Sum of assembly_span',
              containerId: 'chartContainer3'
            } */
          ];

          // Initialize charts
          chartData.forEach((chart, index) => {
            const { series } = getDefaultStackedBarData(chart.data);
            const chartInstance = initEchart({series: series, categories: validCategories}, chart.containerId, chart.title);
            
            if (index === 0) chartInstance1 = chartInstance;
          });

          // ===== ERGA CHART DATA FETCHING AND PROCESSING =====
          // Loading indicator already shows "Fetching data..."

          // Prepare ERGA projects
          const ergaProjectsToFetch = [];
          const ergaValidCategories = [];

          // Get all ERGA projects from ergaList
          Object.entries(ergaList).forEach(([projectName, projectId]) => {
            if (projectId && projectId.trim() !== '') {
              ergaValidCategories.push(projectName);
              ergaProjectsToFetch.push({ projectId, projectName });
            }
          });

          console.log('ERGA Projects to fetch:', ergaProjectsToFetch.map(p => `${p.projectName} (${p.projectId})`));

          // Pre-initialize ERGA data structures
          const ergaSpeciesCounts = {
            'chromosome': new Array(ergaValidCategories.length).fill(0),
            'complete genome': new Array(ergaValidCategories.length).fill(0),
            'contig': new Array(ergaValidCategories.length).fill(0),
            'scaffold': new Array(ergaValidCategories.length).fill(0)
          };

          // Fetch all ERGA project data with automatic pagination
          const ergaProjectPromises = ergaProjectsToFetch.map((project, index) => {
            return fetchAllProjectData(project.projectId, project.projectName);
          });

          const ergaResults = await Promise.all(ergaProjectPromises);
          
          // Log any ERGA projects that failed to load
          const failedErgaProjects = ergaResults.filter(r => r.error);
          if (failedErgaProjects.length > 0) {
            console.warn('⚠️ ERGA Projects with errors:', failedErgaProjects.map(p => `${p.projectName}: ${p.error}`));
          }
          
          // Processing ERGA data - indicator already shows "Fetching data..."

          // Process ERGA data
          ergaResults.forEach((projectResult, index) => {
            if (projectResult.results) {
              projectResult.results.forEach(item => {
                const fields = item.result.fields;
                const assemblyLevel = fields.assembly_level;
                
                if (assemblyLevel && assemblyLevel.value) {
                  const level = assemblyLevel.value.toLowerCase();
                  
                  if (ergaSpeciesCounts.hasOwnProperty(level)) {
                    ergaSpeciesCounts[level][index]++;
                  }
                }
              });
            }
          });

          // Create ERGA chart data structure
          const ergaChartData = {
            data: { report: { report: { yLabel: "Count of Species", histogram: { histograms: { byCat: ergaSpeciesCounts, buckets: [] } } } } },
            title: 'Count of Species',
            containerId: 'chartContainer2'
          };

          // Initialize ERGA chart
          const { series: ergaSeries } = getDefaultStackedBarData(ergaChartData.data);
          chartInstance2 = initEchart({series: ergaSeries, categories: ergaValidCategories}, ergaChartData.containerId, ergaChartData.title, 'ERGA Umbrella');

        } catch (error) {
          console.error('Error loading data:', error);
          showError('chartContainer1', 'Failed to load data. Please try refreshing the page.');
          showError('chartContainer2', 'Failed to load ERGA data. Please try refreshing the page.');
        }
      };

      function initEchart(data, containerId, yLabel, xAxisLabel) {
        const chartDom = document.getElementById(containerId);
        const myChart = echarts.init(chartDom);
        const arr = []
        const len = data.categories.length
        for(let i = 0; i < len; i++) {
          const list = []
          list.push(data.categories[i])

          for(let j = 0; j < data.series.length; j++) {
            list.push(data.series[j].data[i])
          }
          arr.push(list)
        }

        // Sort based on total sum of all values
        arr.sort((a, b) => {
          let sum1 = 0;
          let sum2 = 0;
          // Start from index 1 since index 0 is the category name
          for(let i = 1; i < a.length; i++) {
            sum1 += a[i] || 0;
            sum2 += b[i] || 0;
          }
          return sum2 - sum1;
        });

        // Reconstruct the data arrays after sorting
        const sortedCategories = [];
        const sortedData = data.series.map(() => []);

        arr.forEach((item, index) => {
          sortedCategories.push(item[0]);
          for(let j = 0; j < data.series.length; j++) {
            sortedData[j].push(item[j + 1]);
          }
        });

        // Update the original data structure
        data.categories = sortedCategories;
        data.series.forEach((series, index) => {
          series.data = sortedData[index];
        });

        // Calculate total count and project count for species chart
        let totalCount = 0;
        let projectsWithSpecies = 0;
        if (containerId === 'chartContainer1' || containerId === 'chartContainer2') {
          data.series.forEach(series => {
            series.data.forEach(value => {
              totalCount += value || 0;
            });
          });
          
          // Count projects with non-zero species counts
          for (let i = 0; i < data.categories.length; i++) {
            let projectTotal = 0;
            data.series.forEach(series => {
              projectTotal += series.data[i] || 0;
            });
            if (projectTotal > 0) {
              projectsWithSpecies++;
            }
          }
        }

        const option = {
          title: containerId === 'chartContainer1' ? {
            text: '',
            subtext: `Species Count by Assembly Level - EBP Affiliates`,
            left: 'center',
            textStyle: {
              fontSize: 16,
              fontWeight: 'bold',
              color: '#000'
            },
            subtextStyle: {
              fontSize: 16,
              fontWeight: 'bold',
              color: '#000'  // Match y-axis title color
            }
          } : containerId === 'chartContainer2' ? {
            text: '',
            subtext: `Species Count by Assembly Level - ERGA Umbrella`,
            left: 'center',
            textStyle: {
              fontSize: 16,
              fontWeight: 'bold',
              color: '#000'
            },
            subtextStyle: {
              fontSize: 16,
              fontWeight: 'bold',
              color: '#000'  // Match y-axis title color
            }
          } : undefined,
          legend: {
            show: true,
            selectedMode: false,
            data: ['contig', 'scaffold', 'chromosome', 'complete genome'], // Reorder legend items
            top: containerId === 'chartContainer1' || containerId === 'chartContainer2' ? '10%' : 'top',
            textStyle: {
              color: '#000',
              fontSize: 12,
              fontWeight: 'bold',
            }
          },
          color: ['#ffff33', '#22a884', '#404387', '#7ad151'], // Colors from progress_Family_Species.html: contig, scaffold, chromosome, complete genome
          grid: {
            left: '7%',  // Decreased left margin
            right: '2%',
            top: containerId === 'chartContainer1' || containerId === 'chartContainer2' ? '18%' : '8%',  // More space for title in species chart
            bottom: '20%',  // Increased bottom margin for rotated labels
            containLabel: true
          },
          yAxis: {
            type: "value",
            name: yLabel,
            nameLocation: 'middle',
            nameRotate: 90,
            nameGap: 45,  // Adjust gap to bring label closer
            nameTextStyle: {
              fontWeight: 'bold',
              fontSize: 14,
            },
            axisLine: {
              show: true,
              lineStyle: {
                color: "#000",
                width: 1,
              },
            },
            axisLabel: {
              show: true,
              color: "#000",
              fontSize: 12,
              margin: 5, // Move labels closer to the axis
              formatter: function (value) {
                if (containerId === 'chartContainer1' || containerId === 'chartContainer2') {
                  return value.toLocaleString(); // Show complete numbers for count of species
                } else if (containerId === 'chartContainer3') {
                  return (value / 1e12).toFixed(1) + 'T'; // Convert to T format for genome size and assembly span
                }
                return formatNumber(value);
              }
            },
            splitLine: {
              show: true,
              lineStyle: {
                color: '#ccc'
              }
            },
            interval: containerId === 'chartContainer1' || containerId === 'chartContainer2' ? 500 : 
                      containerId === 'chartContainer3' ? 0.5e12 : 'auto', // Set interval to 0.5T for genome size and assembly span
            minInterval: containerId === 'chartContainer1' || containerId === 'chartContainer2' ? 500 : 
                        containerId === 'chartContainer3' ? 0.5e12 : 1, // Ensure minimum interval of 0.5T for genome size and assembly span
          },
          xAxis: {
            type: "category",
            data: arr.map(item => (item[0])), // Create an array of years from 2006 to 2024
            axisLine: {
              show: true,
              lineStyle: {
                color: "#000",
                width: 1,
              },
              
            },
            axisLabel: {
              show: true,
              color: "#000",
              fontSize: 12,
              rotate: 45,
        
            //   fontFamily: 'Times News Roman' 
            // fontWeight: 700
            },
            name: (containerId === 'chartContainer1' || containerId === 'chartContainer2') ? '' : (xAxisLabel || "EBP affiliates"), // Hide x-axis name for both charts since it's in the title
            nameLocation: 'middle', // Place the label in the middle 
            nameGap: (containerId === 'chartContainer1' || containerId === 'chartContainer2') ? 0 : 80,  // No gap when name is hidden
            nameTextStyle: (containerId === 'chartContainer1' || containerId === 'chartContainer2') ? {} : {
              fontWeight: 'bold',
              fontSize: 14,
              padding: [10, 0, 0, 0], // Adjust padding to move the label slightly away from the axis
            },
            splitLine: {
              show: false,
            },
          },
          tooltip: {
            trigger: "axis",
            position: function (point, params, dom, rect, size) {
              // Get the chart container width and tooltip dimensions
              var chartWidth = size.viewSize[0];
              var tooltipWidth = size.contentSize[0];
              var tooltipHeight = size.contentSize[1];
              
              // Position tooltip close to the mouse with smart positioning
              // Default: 15px offset from mouse
              var x = point[0] + 15;
              var y = point[1] - tooltipHeight / 2;
              
              // If tooltip would go off the right edge, position it to the left
              if (x + tooltipWidth > chartWidth) {
                x = point[0] - tooltipWidth - 15;
              }
              
              // Keep tooltip within vertical bounds
              if (y < 0) y = 5;
              if (y + tooltipHeight > size.viewSize[1]) y = size.viewSize[1] - tooltipHeight - 5;
              
              return [x, y];
            },
            formatter: function (params) {
              // Add project name as the first line
              var projectName = params[0].name;
              var header = "<strong>" + projectName + "</strong><br/>";
              
              var res = params
                .map(function (item) {
                  return item.seriesName + ": " + (item.value || 0).toLocaleString();
                })
                .join("<br/>");

              // For total calculation
              var total = 0;
              params.forEach(function (item) {
                total += item.value || 0;
              });

              return header + res + "<br/>Total: " + total.toLocaleString();
            },
          },
          series: data.series,
        };
        myChart.setOption(option);
      
        return myChart
      }
    </script>
  </body>
</html>
