<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="copyright" content="Data source: Genomes on a Tree (GoaT). Used with permission." />
    <meta name="author" content="Fang Chen" />
    <title>EBP Progress by Phylum</title>
    <script src="../config.js"></script>
    <script src="./echarts.min.js"></script>
    <script src="./utils.js"></script>
    <script src="./services.js"></script>
    <style>
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        padding-bottom: 30px;
      }
      .chart-container {
        width: 70%;
        height: 550px;
        margin: 0px auto 40px auto;
        position: relative;
      }

      /* Footer styles */
      #footer {
        position: fixed;
        bottom: 0;
        width: 100%;
        background-color: rgba(248, 249, 250, 0.95);
        color: #333;
        text-align: center;
        padding: 5px;
        z-index: 9999;
        box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
        font-size: 14px;
      }

      #error-message {
        color: red;
        text-align: center;
        margin: 20px;
        display: none;
      }

      #phylumInfoBox {
        width: 220px;
        margin-right: 0px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        font-size: 18px;
        margin-top: -80px;
      }
      #phylumInfoBox .total-species {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 14px;
      }
      #phylumInfoBox .breakdown {
        font-size: 16px;
        color: #666;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <div id="error-message"></div>
    <div class="container">
      <div id="phylumInfoBox"></div>
      <div id="phylumProgressContainer" class="chart-container"></div>
    </div>

    <div id="footer">
        <div id="copyright">Data source: Genomes on a Tree (GoaT). Used with permission.</div>
    </div>

    <script>
      let phylumChart = null;
      
      // Format number with commas - defined globally for use in multiple functions
      function formatNumber(num) {
        if (num === undefined || num === null) return '0';
        return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      }
      
      window.onload = function () {
        const phylumUrl = "https://goat.genomehubs.org/api/v2/report?report=histogram&x=bioproject%3DPRJNA533106%20AND%20tax_tree%28eukaryota%29&rank=species&result=taxon&cat=phylum%5B10%5D%2B&excludeAncestral%5B0%5D=bioproject&excludeMissing%5B0%5D=bioproject&xOpts=PRJNA533106%2C%2C1%2C%2C&caption=Number%20of%20eukaryotic%20species%20sequenced%20by%20EBP%20by%20phylum&taxonomy=ncbi&includeEstimates=true";
        const totalSpeciesUrl = "https://goat.genomehubs.org/api/v2/search?result=taxon&query=bioproject%3DPRJNA533106%20AND%20tax_rank%28species%29&taxonomy=ncbi&includeEstimates=true&excludeMissing%5B0%5D=bioproject&fields=bioproject&size=100&offset=0&names=&ranks=phylum";
        
        console.log('Fetching data from:', phylumUrl);
        
        // First fetch the total species count
        fetchData(totalSpeciesUrl).then((totalData) => {
          console.log('Total species API response:', totalData);
          let totalSpecies = 0;
          if (totalData.status && typeof totalData.status.hits === 'number') {
            totalSpecies = totalData.status.hits;
          } else {
            console.warn('Could not find total species count in API response.');
          }
          if (!totalSpecies || isNaN(totalSpecies)) {
            totalSpecies = 0;
          }
          
          // Then fetch the phylum data
          return fetchData(phylumUrl).then((data) => {
            console.log('Raw API response:', data);
            
            // Extract phyla and counts from the cats array
            const categories = [];
            const values = [];
            
            // Log the raw cats array
            console.log('Raw cats array:', data.report.report.histogram.cats);
            
            // Process each phylum group
            data.report.report.histogram.cats.forEach((item) => {
              console.log('Processing item:', item);
              // Normalize the label to handle case sensitivity and '+'
              const normalizedLabel = (item.label.toLowerCase() === 'other' || item.label === '+') ? 'Other' : item.label;
              categories.push(normalizedLabel);
              
              // Ensure we're working with numbers and handle any potential string values
              const count = typeof item.doc_count === 'string' ? parseInt(item.doc_count, 10) : item.doc_count;
              
              console.log(`Processing ${normalizedLabel}:`, {
                rawValue: item.doc_count,
                parsedValue: count,
                type: typeof item.doc_count,
                label: item.label
              });
              values.push(count);
            });
            
            // Calculate the sum of top 10 phyla
            const sumTop10 = values.reduce((sum, count) => sum + count, 0);
            
            // Calculate the "Other" group value
            let otherValue = totalSpecies - sumTop10;
            if (isNaN(otherValue) || otherValue < 0) otherValue = 0;
            
            // Replace the "Other" value in the arrays
            const otherIndex = categories.findIndex(cat => cat === 'Other');
            if (otherIndex !== -1) {
              values[otherIndex] = otherValue;
            }
            
            // Sort the data by count in descending order, but keep "Other" at the end
            const sortedIndices = values.map((_, i) => i).sort((a, b) => {
              if (categories[a] === 'Other') return 1;
              if (categories[b] === 'Other') return -1;
              return values[b] - values[a];
            });
            const sortedCategories = sortedIndices.map(i => categories[i]);
            const sortedValues = sortedIndices.map(i => values[i]);
            
            // Log the sorted data to check "Other" category
            console.log('Sorted data:', sortedCategories.map((cat, idx) => ({
              category: cat,
              value: sortedValues[idx],
              originalIndex: sortedIndices[idx]
            })));
            
            // Define a color palette (adjust as needed for your number of bars)
            const colorPalette = [
              '#4B1979', // deep purple
              '#3B3B98', // blue
              '#218cbe', // blue-green
              '#38ada9', // teal
              '#b8e994', // light green
              '#f6e58d', // yellow
              '#ffbe76', // orange
              '#e17055', // red-orange
              '#6ab04c', // green
              '#f9ca24', // yellow
              '#8e44ad'  // purple for 'Other'
            ];

            // Map each value to an object with its color
            const coloredData = sortedValues.map((value, idx) => ({
              value,
              itemStyle: { color: colorPalette[idx % colorPalette.length] }
            }));

            const chartData = {
              categories: sortedCategories,
              series: [{
                name: 'Species Count',
                type: 'bar',
                data: coloredData,
                barWidth: '95%',
                barGap: '-100%'
              }]
            };
            
            console.log('Raw values:', values);
            console.log('Sorted values:', sortedValues);
            console.log('Total species:', totalSpecies);
            console.log('Processed chart data:', chartData);
            console.log('Categories:', sortedCategories);
            console.log('Values:', sortedValues);

            const breakdownText = sortedCategories.map((category, index) => {
              const value = sortedValues[index];
              if (value === undefined || value === null) return `${category}: 0`;
              return `${category}: ${formatNumber(value)}`;
            }).join('<br>');

            const infoBox = document.getElementById('phylumInfoBox');
            infoBox.innerHTML = `
              <div class="total-species">Total Species: ${formatNumber(totalSpecies)}</div>
              <div class="breakdown">${breakdownText}</div>
            `;
            
            // Calculate dynamic Y-axis max based on the maximum value
            const maxValue = Math.max(...sortedValues);
            // Round up to the next nice interval (multiple of 600 for clean labels)
            const dynamicMax = Math.ceil(maxValue / 600) * 600;
            
            phylumChart = initEchart(chartData, 'phylumProgressContainer', totalSpecies, sortedCategories, sortedValues, dynamicMax);
          });
        }).catch(error => {
          console.error('Error:', error);
          const errorMessage = document.getElementById('error-message');
          errorMessage.textContent = `Error loading data: ${error.message}`;
          errorMessage.style.display = 'block';
        });
        setTimeout(function() {
          window.scrollTo(0, 0);
        }, 100);
      };

      function initEchart(data, containerId, totalSpecies, categories, values, yAxisMax) {
        const chartDom = document.getElementById(containerId);
        if (!chartDom) {
          throw new Error(`Container ${containerId} not found`);
        }
        
        const myChart = echarts.init(chartDom);

        // Create breakdown text with error checking
        const breakdownText = categories.map((category, index) => {
          const value = values[index];
          if (value === undefined || value === null) return `${category}: 0`;
          return `${category}: ${formatNumber(value)}`;
        }).join('\n');

        const option = {
          title: {
            text: 'Number of eukaryotic species sequenced by EBP by phylum',
            left: 'center',
            top: 5,
            textStyle: {
              fontSize: 20,
              fontWeight: 'bold',
              color: '#333'
            }
          },
          tooltip: {
            trigger: 'axis',
            axisPointer: {
              type: 'shadow'
            },
            position: function (point, params, dom, rect, size) {
              // Get the chart container width
              var chartWidth = size.viewSize[0];
              var tooltipWidth = size.contentSize[0];
              var tooltipHeight = size.contentSize[1];
              
              // Position tooltip on the right side of the chart
              // If there's enough space on the right, position it there
              // Otherwise, position it on the left side of the mouse
              var x = point[0] + 20; // 20px offset from mouse
              if (x + tooltipWidth > chartWidth) {
                x = point[0] - tooltipWidth - 20; // Position on left if not enough space on right
              }
              
              // Keep tooltip within vertical bounds
              var y = point[1] - tooltipHeight / 2;
              if (y < 0) y = 0;
              if (y + tooltipHeight > size.viewSize[1]) y = size.viewSize[1] - tooltipHeight;
              
              return [x, y];
            },
            formatter: function(params) {
              // Use the same formatNumber function as elsewhere
              function formatNumber(num) {
                if (num === undefined || num === null) return '0';
                return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
              }
              return `${params[0].name}: ${formatNumber(params[0].value)} species`;
            },
            backgroundColor: 'rgba(255, 255, 255, 0.9)',
            borderColor: '#ccc',
            borderWidth: 1,
            textStyle: {
              color: '#333'
            }
          },
          grid: {
            left: '8%',
            right: '4%',
            bottom: '15%',
            top: '15%',
            containLabel: true
          },
          xAxis: {
            type: 'category',
            data: data.categories,
            axisLabel: {
              interval: 0,
              rotate: 45,
              color: '#333'
            },
            axisLine: {
              lineStyle: {
                color: '#ccc'
              }
            }
          },
          yAxis: {
            type: 'value',
            name: 'Count of species',
            nameLocation: 'middle',
            nameGap: 50,
            nameTextStyle: {
              fontWeight: 'bold',
              color: '#333',
              fontSize: 14
            },
            axisLabel: {
              fontSize: 12,
              color: '#333'
            },
            axisLine: {
              lineStyle: {
                color: '#333'
              }
            },
            splitLine: {
              show: false
            },
            min: 0,
            max: yAxisMax || 1800,
            interval: (yAxisMax || 1800) / 3,
            axisTick: {
              show: true,
              alignWithLabel: true
            }
          },
          series: data.series
        };

        myChart.setOption(option);
        return myChart;
      }

      // Add copyright notice with fallback
      try {
        const copyrightElement = document.getElementById('copyright');
        if (window.copyright && window.copyright.notice) {
          copyrightElement.textContent = copyright.notice;
        }
      } catch (e) {
        console.warn('Copyright configuration not loaded:', e);
      }
    </script>
  </body>
</html>
