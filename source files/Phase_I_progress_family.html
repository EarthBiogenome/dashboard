<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBP Phase I Progress</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: transparent;
            padding: 1rem;
        }

        .progress-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            animation: progressFadeIn 0.6s ease-out;
        }

        .progress-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .progress-chart {
            display: flex;
            align-items: flex-start;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .progress-chart + .progress-chart {
            margin-top: 1.25rem;
        }

        .progress-label {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #2c3e50;
            min-width: 100px;
            height: 44px;
        }

        .progress-label i {
            font-size: 1.4rem;
            color: #0d7a47;
        }

        .progress-bar-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .progress-bar-wrapper {
            position: relative;
        }

        .progress-bar {
            display: flex;
            height: 44px;
            background: #d8e6de;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
        }

        .progress-completed {
            background: linear-gradient(135deg, #0d7a47 0%, #16a34a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.05rem;
            font-weight: 600;
            transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 0;
            box-shadow: 2px 0 8px rgba(13, 122, 71, 0.3);
            position: relative;
        }

        .progress-completed::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0%, transparent 100%);
            border-radius: 8px 8px 0 0;
        }

        .progress-completed-text {
            white-space: nowrap;
            padding: 0 15px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
        }

        .progress-incomplete {
            background: transparent;
            flex: 1;
        }

        .progress-axis {
            position: relative;
            height: 35px;
        }

        .progress-axis-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: #999;
        }

        .progress-axis-tick {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            transform: translateX(-50%);
            top: 0;
        }

        .progress-axis-tick::before {
            content: '';
            width: 1px;
            height: 8px;
            background-color: #888;
        }

        .progress-axis-label {
            font-size: 0.85rem;
            color: #555;
            font-weight: 500;
            margin-top: 4px;
        }

        @keyframes progressFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .progress-section { padding: 1rem; }
            .progress-title { font-size: 1.2rem; }
            .progress-chart {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .progress-label { justify-content: flex-start; height: auto; }
            .progress-bar-container { width: 100%; }
            .progress-bar { height: 38px; }
            .progress-completed { font-size: 0.9rem; }
            .progress-axis-label { font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="progress-section">
        <div class="progress-title">EBP Phase I Progress</div>

        <!-- Families bar -->
        <div class="progress-chart">
            <div class="progress-label">
                <i class="fas fa-layer-group"></i>
                <span>Families</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-wrapper">
                    <div class="progress-bar">
                        <div class="progress-completed" id="progress-family-completed" style="width: 0%;">
                            <span class="progress-completed-text" id="progress-family-text">Loading...</span>
                        </div>
                        <div class="progress-incomplete"></div>
                    </div>
                </div>
                <div class="progress-axis" id="progress-family-axis">
                    <div class="progress-axis-line"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const EBP_ARC_URL   = "https://goat.genomehubs.org/api/v2/report?report=arc&x=assembly_span%20AND%20bioproject%3DPRJNA533106&rank=phylum%2Cclass%2Corder%2Cfamily%2Cgenus%2Cspecies&includeEstimates=true&excludeAncestral%5B0%5D=bioproject&excludeMissing%5B0%5D=bioproject&caption=EBP%20taxa&taxonomy=ncbi&result=taxon&queryId=8EWp2aVcZB";
        const INSDC_ARC_URL = "https://goat.genomehubs.org/api/v2/report?report=arc&x=assembly_span&rank=phylum%2Cclass%2Corder%2Cfamily%2Cgenus%2Cspecies&includeEstimates=true&excludeAncestral%5B0%5D=assembly_span&excludeMissing%5B0%5D=assembly_span&caption=INSDC%20taxa&taxonomy=ncbi&result=taxon&queryId=R8LGXM94GW";

        function createAxisTicks(axisContainerId, max, tickValues) {
            const axisContainer = document.getElementById(axisContainerId);
            if (!axisContainer) return;
            axisContainer.querySelectorAll('.progress-axis-tick').forEach(el => el.remove());
            tickValues.forEach(value => {
                const tick = document.createElement('div');
                tick.classList.add('progress-axis-tick');
                tick.style.left = `${(value / max) * 100}%`;
                const label = document.createElement('span');
                label.classList.add('progress-axis-label');
                label.textContent = value.toLocaleString();
                tick.appendChild(label);
                axisContainer.appendChild(tick);
            });
        }

        async function fetchFamilyCounts() {
            try {
                const [ebpRes, insdcRes] = await Promise.all([
                    fetch(EBP_ARC_URL).then(r => r.ok ? r.json() : null),
                    fetch(INSDC_ARC_URL).then(r => r.ok ? r.json() : null)
                ]);
                const ebpFamily   = ebpRes?.report?.report?.arc?.find(item => item.rank === 'family');
                const insdcFamily = insdcRes?.report?.report?.arc?.find(item => item.rank === 'family');
                const ebpCount    = Math.max(0, Number(ebpFamily?.x) || 0);
                const totalCount  = Math.max(1, Number(insdcFamily?.y) || 10359);
                const percentage  = Math.min((ebpCount / totalCount) * 100, 100);
                document.getElementById('progress-family-completed').style.width = `${percentage}%`;
                document.getElementById('progress-family-text').textContent = `${ebpCount.toLocaleString()} (${percentage.toFixed(1)}%)`;
                const tickValues = [0, 2000, 4000, 6000, 8000];
                if (tickValues[tickValues.length - 1] !== totalCount) tickValues.push(totalCount);
                createAxisTicks('progress-family-axis', totalCount, tickValues);
            } catch (error) {
                console.error('Error fetching family counts:', error);
                document.getElementById('progress-family-text').textContent = 'Data unavailable';
            }
        }

        fetchFamilyCounts();
    </script>
</body>
</html>
