<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <meta name="copyright" content="Data source: Genomes on a Tree (GoaT). Used with permission." /> -->
    <meta name="author" content="Fang Chen" />
    <title>EBP Progress</title>
    <script src="../config.js"></script>
    <script src="./echarts.min.js"></script>
    <script src="./utils.js"></script>
    <script src="./services.js"></script>
    <style>
      .page-title {
        text-align: center;
        font-weight: bold;
        margin: 5vh 0 0 0 !important;
        color: #333;
        letter-spacing: 1px;
        padding: 0;
        font-size: 2.0vw;
      }
      .container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2vh;
        padding-bottom: 1vh;
        margin-top: 5vh;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
      }
      .column {
        width: 100%;
        max-width: 700px;
        min-width: 320px;
        box-sizing: border-box;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }
      .chart-container {
        width: 100%;
        aspect-ratio: 16/9;
        min-height: 300px;
        max-height: 70vh;
        margin: 0 auto 2vh auto;
        position: relative;
      }

      /* Footer styles */
      #footer {
        position: fixed;
        bottom: 0;
        width: 100%;
        left: 0;
        background-color: rgba(248, 249, 250, 0.95);
        color: #333;
        text-align: center;
        padding: 5px;
        z-index: 9999;
        box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
        font-size: 14px;
      }

      /* Container for centering and styling */
      .select-container {
        display: flex;
        justify-content: center;
        align-items: flex-end;  /* Align to bottom for consistent height */
        margin: 30px 0 20px 0;  /* Increased top margin for more space below title */
        position: relative;
        z-index: 1;  /* Ensure it stays above other elements */
        gap: 40px;  /* Increased gap between dropdown groups */
      }

      /* Select group styling */
      .select-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .select-label {
        font-size: 14px;
        font-weight: bold;
        color: #333;
        margin: 0;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      /* Custom select style */
      .custom-select {
        position: relative;
        display: inline-block;
        width: 140px;  /* Increased width for better spacing */
      }

      .select-box {
        appearance: none;
        background-color: #ffffff;
        border: 2px solid #cccccc;
        border-radius: 8px;
        padding: 5px 20px;  /* Reduced vertical padding from 10px to 5px */
        font-size: 16px;
        color: #333333;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
        width: 100%;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
        height: 32px;  /* Added fixed height */
        line-height: 20px;  /* Added line height for vertical centering */
      }

      .select-box::after {
        content: '▼';
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 12px;
        color: #888888;
      }

      .select-box:hover,
      .select-box:focus {
        border-color: #666666;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }

      /* Dropdown list */
      .options-container {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background-color: #ffffff;
        border: 2px solid #cccccc;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        display: none;
        z-index: 999;
      }

      .option {
        padding: 5px 20px;  /* Reduced padding to match select box */
        font-size: 16px;
        color: #333333;
        cursor: pointer;
        transition: background-color 0.2s ease;
        font-family: Arial, sans-serif;
        line-height: 20px;  /* Added line height for consistency */
      }

      .option:hover {
        background-color: #f0f0f0;
      }

      /* Show options on click */
      .custom-select.active .options-container {
        display: block;
      }

      @media (max-width: 900px) {
        .container {
          flex-direction: column;
          gap: 2vh;
        }
        .column {
          max-width: 100%;
        }
        .page-title {
          font-size: 4vw;
        }
      }

      @media (min-width: 2000px) {
        .chart-container {
          max-width: 1200px;
          max-height: 60vh;
        }
        .page-title {
          font-size: 1.5vw;
        }
      }
    </style>
  </head>
  <body>
    <h1 class="page-title">Annual EBP Progress</h1>
    <div class="select-container">
      <div class="select-group">
        <label class="select-label">Data Type</label>
        <div class="custom-select">
          <div class="select-box">Cumulative</div>

            <div class="option">Cumulative</div>

      <div class="select-group">
        <label class="select-label">Start Year</label>

          <div class="options-container">
            <div class="option">2010</div>

            <div class="option">2014</div>
            <div class="option">2015</div>
            <div class="option">2016</div>
            <div class="option">2017</div>
            <div class="option">2018</div>
            <div class="option">2019</div>
            <div class="option">2020</div>
            <div class="option">2021</div>
            <div class="option">2022</div>
            <div class="option">2023</div>
            <div class="option">2024</div>

      <div class="select-group">
        <label class="select-label">End Year</label>
        <div class="custom-select">
          <div class="select-box">2025</div>
          <div class="options-container">
            <div class="option">2010</div>
            <div class="option">2011</div>
            <div class="option">2012</div>
            <div class="option">2013</div>
            <div class="option">2014</div>
            <div class="option">2015</div>
            <div class="option">2016</div>
            <div class="option">2017</div>
            <div class="option">2018</div>
            <div class="option">2019</div>
            <div class="option">2020</div>
            <div class="option">2021</div>
            <div class="option">2022</div>
            <div class="option">2023</div>
            <div class="option">2024</div>
            <div class="option">2025</div>
          </div>
        </div>
      </div>
    </div>
    <div class="container">
      <div class="column">
        <!-- Species Progress -->
        <!-- <div id="speciesProgressContainer1" class="chart-container"></div>
        <div id="speciesProgressContainer2" class="chart-container"></div>
        <div id="speciesProgressContainer3" class="chart-container"></div> -->
        <div id="speciesProgressContainer" class="chart-container"></div>
      </div>
      <div class="column">
        <!-- Family Progress -->
        <!-- <div id="familyProgressContainer1" class="chart-container"></div>
        <div id="familyProgressContainer2" class="chart-container"></div>
        <div id="familyProgressContainer3" class="chart-container"></div> -->
        <div id="familyProgressContainer" class="chart-container"></div>
      </div>
    </div>

    <div id="footer">
        <div id="copyright">Data source: Genomes on a Tree (GoaT). Used with permission.</div>
    </div>

    <script>
      console.log('=== SCRIPT LOADING ===');
      const familyDataMap = {}
      const speciesDataMap = {}
      let activeType = 'Cumulative'
      let startYear = 2010
      let endYear = 2025
      let familyChart = null
      let speciesChart = null
      
      // Test function to run directly in console
      function testSpeciesAPI() {
        console.log('Testing species API...');
        const testUrl = "https://goat.genomehubs.org/api/v2/search?query=bioproject%3DPRJNA533106%20AND%20tax_rank%28species%29&result=taxon&includeEstimates=true&taxonomy=ncbi&size=100&offset=0&fields=assembly_date%2Cassembly_level%2Cassembly_span";
        
        return fetch(testUrl)
          .then(response => {
            console.log('API Response Status:', response.status);
            return response.json();
          })
          .then(data => {
            console.log('API Response Data:', data);
            console.log('Results count:', data.results ? data.results.length : 'No results');
            if (data.results && data.results.length > 0) {
              console.log('First result:', data.results[0]);
              console.log('First result fields:', Object.keys(data.results[0]));
            }
            return data;
          })
          .catch(error => {
            console.error('API Error:', error);
            throw error;
          });
      }
      
      // Test function for family API
      function testFamilyAPI() {
        console.log('Testing family API...');
        const testUrl = "https://goat.genomehubs.org/api/v2/search?query=bioproject%3DPRJNA533106%20AND%20tax_rank%28family%29&result=taxon&includeEstimates=true&taxonomy=ncbi&size=100&offset=0&fields=assembly_date%2Cassembly_level%2Cassembly_span";
        
        return fetch(testUrl)
          .then(response => {
            console.log('Family API Response Status:', response.status);
            return response.json();
          })
          .then(data => {
            console.log('Family API Response Data:', data);
            console.log('Family results count:', data.results ? data.results.length : 'No results');
            if (data.results && data.results.length > 0) {
              console.log('First family result:', data.results[0]);
              console.log('First family result fields:', Object.keys(data.results[0]));
            }
            return data;
          })
          .catch(error => {
            console.error('Family API Error:', error);
            throw error;
          });
      }

      // Cache management functions
      function clearCache() {
        localStorage.removeItem('ebp_search_data_v1');
        console.log('Cache cleared');
      }
      
      // Helper function to get effective start year based on user selection and data availability
      function getEffectiveStartYear(dataType) {
        const dataStartYear = 2010; // Data from services.js is already filtered to 2010-2025
        return Math.max(startYear, dataStartYear);
      }

      // Helper function to validate year range
      function validateYearRange() {
        if (startYear > endYear) {
          console.warn(`Start year (${startYear}) is greater than end year (${endYear}). Swapping values.`);
          const temp = startYear;
          startYear = endYear;
          endYear = temp;
          
          // Update the UI to reflect the swap
          updateYearDropdowns();
        }
      }

      // Helper function to convert actual data to cumulative data
      function calculateCumulativeFromActual(actualData) {
        const cumulativeData = {
          category: actualData.category,
          series: [],
          tableName: actualData.tableName.replace('(Actual)', '(Cumulative)')
        };
        
        // For each series (assembly level)
        actualData.series.forEach(actualSeries => {
          const cumulativeSeries = {
            ...actualSeries,
            data: []
          };
          
          // Calculate cumulative sum
          let cumSum = 0;
          actualSeries.data.forEach(value => {
            cumSum += value;
            cumulativeSeries.data.push(cumSum);
          });
          
          // Update description with total
          cumulativeSeries.description = formatNumber(cumSum);
          cumulativeData.series.push(cumulativeSeries);
        });
        
        return cumulativeData;
      }

      // Helper function to recalculate cumulative data for filtered year range
      function recalculateCumulativeForYearRange(actualData, startYear, endYear) {
        const dataStartYear = 2010;
        const startIndex = startYear - dataStartYear;
        const endIndex = endYear - dataStartYear;
        
        const cumulativeData = {
          category: actualData.category.slice(startIndex, endIndex + 1),
          series: [],
          tableName: actualData.tableName.replace('(Actual)', '(Cumulative)')
        };
        
        // For each series (assembly level)
        actualData.series.forEach(actualSeries => {
          const cumulativeSeries = {
            ...actualSeries,
            data: []
          };
          
          // Calculate cumulative sum for the filtered range
          let cumSum = 0;
          const filteredData = actualSeries.data.slice(startIndex, endIndex + 1);
          
          filteredData.forEach(value => {
            cumSum += value;
            cumulativeSeries.data.push(cumSum);
          });
          
          // Update description with total for this range
          cumulativeSeries.description = formatNumber(cumSum);
          cumulativeData.series.push(cumulativeSeries);
        });
        
        return cumulativeData;
      }

      // Make them available globally
      window.testSpeciesAPI = testSpeciesAPI;
      window.testFamilyAPI = testFamilyAPI;
      window.clearCache = clearCache;
      // Function to initialize both charts after all data is loaded
      function initializeChartsAfterDataLoaded() {
        // Check if both datasets are available
        if (familyDataMap[activeType] && speciesDataMap[activeType]) {
          console.log('Both datasets loaded, initializing charts with optimal start year...');
          
          // Now we can calculate the optimal start year with both datasets available
          familyChart = initEchart(familyDataMap[activeType], 'familyProgressContainer', `Count of Families (${activeType})`);
          speciesChart = initEchart(speciesDataMap[activeType], 'speciesProgressContainer', `Count of Species (${activeType})`);
          
          // Hide loading indicators for both charts after they are created
          hideLoadingIndicator('familyProgressContainer');
          hideLoadingIndicator('speciesProgressContainer');
        }
      }

      window.onload = function () {
        console.log('=== WINDOW.ONLOAD STARTED ===');
        console.log('Active type:', activeType);
        
        // Show loading indicators for both charts
        showLoadingIndicator('familyProgressContainer');
        showLoadingIndicator('speciesProgressContainer');
        
        // Family Progress - Load search data to ensure 2025 data is included
        console.log('Starting family data fetch from search endpoint...');
        const familySearchUrl = "https://goat.genomehubs.org/api/v2/search?query=bioproject%3DPRJNA533106%20AND%20tax_rank%28family%29&result=taxon&includeEstimates=true&taxonomy=ncbi&size=2000&offset=0&fields=assembly_date%2Cassembly_level";
        
        // Load actual data from search endpoint and calculate cumulative from it
        console.log('Loading family search data to calculate accurate cumulative...');
        const familyDataPromise = window.getFamilySearchData(familySearchUrl).then(({defaultData, percentData}) => {
          console.log('Family search data loaded, calculating cumulative...');
          
          // Calculate cumulative from actual data to ensure 2025 is included
          const cumulativeData = calculateCumulativeFromActual(defaultData);
          
          // Store all three data types
          familyDataMap['Actual'] = defaultData;
          familyDataMap['YoY Growth'] = percentData;
          familyDataMap['Cumulative'] = cumulativeData;
          
          console.log('Family cumulative data calculated from actual data');
          console.log('Sample cumulative data for verification:', cumulativeData);
          
          // Try to initialize charts after family data is loaded
          initializeChartsAfterDataLoaded();
        }).catch(error => {
          console.error('Error loading family search data:', error);
          // Show error message for family chart
          showErrorMessage('familyProgressContainer', 'family');
        });

        // Species Progress - Load search data to ensure 2025 data is included
        console.log('=== STARTING SPECIES SECTION ===');
        const speciesSearchUrl = "https://goat.genomehubs.org/api/v2/search?query=bioproject%3DPRJNA533106%20AND%20tax_rank%28species%29&result=taxon&includeEstimates=true&taxonomy=ncbi&size=5000&offset=0&fields=assembly_date%2Cassembly_level";
        
        console.log('Starting species data fetch from search endpoint...');
        console.log('Species search URL:', speciesSearchUrl);
        
        // Load actual data from search endpoint and calculate cumulative from it
        console.log('Loading species search data to calculate accurate cumulative...');
        const speciesDataPromise = window.getSpeciesSearchData(speciesSearchUrl).then(({defaultData, percentData}) => {
          console.log('Species search data loaded, calculating cumulative...');
          
          // Calculate cumulative from actual data to ensure 2025 is included
          const cumulativeData = calculateCumulativeFromActual(defaultData);
          
          // Store all three data types
          speciesDataMap['Actual'] = defaultData;
          speciesDataMap['YoY Growth'] = percentData;
          speciesDataMap['Cumulative'] = cumulativeData;
          
          console.log('Species cumulative data calculated from actual data');
          console.log('Sample cumulative data for verification:', cumulativeData);
          
          // Try to initialize charts after species data is loaded
          initializeChartsAfterDataLoaded();
        }).catch(error => {
          console.error('Error loading species search data:', error);
          // Hide loading indicator on error and show error message
          hideLoadingIndicator('speciesProgressContainer');
          showErrorMessage('speciesProgressContainer', 'species');
        });
      };

      // Helper function to apply consistent ordering to series data
      function applyConsistentOrdering(seriesData, containerId) {
        // Define consistent color mapping based on assembly level names
        const assemblyLevelColors = {
          'contig': '#ffff33',        // yellow
          'scaffold': '#22a884',     // teal
          'chromosome': '#404387',   // dark blue
          'complete genome': '#7ad151' // green
        };

        // Apply consistent colors to series based on their names
        let seriesWithColors = seriesData.map(series => ({
          ...series,
          itemStyle: {
            color: assemblyLevelColors[series.name] || '#cccccc' // fallback color
          }
        }));

        // Both charts now use the same consistent order: contig, scaffold, chromosome, complete genome
        return seriesWithColors;
      }

      function checkoutChart(type) {
        if(activeType === type) return;
        
        // All data is now loaded upfront, so just switch views directly
        switchToView(type);
      }
      
      function checkoutStartYear(year) {
        const newStartYear = parseInt(year);
        if(startYear === newStartYear) return;
        
        startYear = newStartYear;
        validateYearRange();
        console.log(`Start year changed to: ${startYear}`);
        
        // Reinitialize charts with new year range
        if (familyChart && speciesChart) {
          switchToView(activeType);
        }
      }
      
      function checkoutEndYear(year) {
        const newEndYear = parseInt(year);
        if(endYear === newEndYear) return;
        
        endYear = newEndYear;
        validateYearRange();
        console.log(`End year changed to: ${endYear}`);
        
        // Reinitialize charts with new year range
        if (familyChart && speciesChart) {
          switchToView(activeType);
        }
      }
      
      function switchToView(type) {
        const familyOption = familyChart.getOption();
        const speciesOption = speciesChart.getOption();
        familyOption.yAxis[0].name = `Count of Families (${type})`;
        speciesOption.yAxis[0].name = `Count of Species (${type})`;
        
        // Update activeType before calculating start year
        activeType = type;
        
        // Calculate optimal start year for each chart independently
        const familyStartYear = findOptimalStartYearForData(familyDataMap[type], 'Family');
        const speciesStartYear = findOptimalStartYearForData(speciesDataMap[type], 'Species');
        
        console.log(`Switching to ${type}: Family starts ${familyStartYear}, Species starts ${speciesStartYear}, End year: ${endYear}`);
        
        // Generate year ranges for each chart using the selected end year
        const familyYearRange = Array.from({length: endYear - familyStartYear + 1}, (_, i) => familyStartYear + i);
        const speciesYearRange = Array.from({length: endYear - speciesStartYear + 1}, (_, i) => speciesStartYear + i);
        
        // Update x-axis data with independent year ranges
        familyOption.xAxis[0].data = familyYearRange;
        speciesOption.xAxis[0].data = speciesYearRange;
        
        // Get the appropriate data based on type
        let familySeries, speciesSeries;
        
        if (type === 'Cumulative') {
          // Recalculate cumulative data for the selected year range
          const familyCumulativeData = recalculateCumulativeForYearRange(familyDataMap['Actual'], familyStartYear, endYear);
          const speciesCumulativeData = recalculateCumulativeForYearRange(speciesDataMap['Actual'], speciesStartYear, endYear);
          
          familySeries = familyCumulativeData.series;
          speciesSeries = speciesCumulativeData.series;
          
          console.log(`Recalculated cumulative data for Family: ${familyStartYear}-${endYear}`);
          console.log(`Recalculated cumulative data for Species: ${speciesStartYear}-${endYear}`);
        } else {
          // For Actual and YoY Growth, trim the existing data
          familySeries = trimSeriesToStartYear(familyDataMap[type].series, familyStartYear, 'familyProgressContainer');
          speciesSeries = trimSeriesToStartYear(speciesDataMap[type].series, speciesStartYear, 'speciesProgressContainer');
        }
        
        // Apply consistent ordering to series data
        familyOption.series = applyConsistentOrdering(familySeries, 'familyProgressContainer');
        speciesOption.series = applyConsistentOrdering(speciesSeries, 'speciesProgressContainer');
        
        familyChart.setOption(familyOption);
        speciesChart.setOption(speciesOption);
      }
      
      // Helper function to format numbers (used in calculateCumulativeFromActual)
      function formatNumber(num) {
        if (typeof num !== 'number') return num;
        return num.toLocaleString();
      }
      
      // Generic loading indicator functions for both charts
      function showLoadingIndicator(containerId) {
        const container = document.getElementById(containerId);
        if (container) {
          container.innerHTML = `
            <div style="
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              height: 100%;
              font-family: Arial, sans-serif;
              color: #333;
              background-color: #f9f9f9;
              border-radius: 8px;
            ">
              <div style="
                width: 60px;
                height: 60px;
                border: 6px solid #e3e3e3;
                border-top: 6px solid #3498db;
                border-radius: 50%;
                animation: spin 1s linear infinite;
                margin-bottom: 20px;
              "></div>
              <div style="
                font-size: 16px;
                font-weight: normal;
                color: #666;
              ">Fetching data...</div>
            </div>
            <style>
              @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
              }
            </style>
          `;
        }
      }
      
      function hideLoadingIndicator(containerId) {
        // Don't clear the container - let echarts.init() handle replacing the content
        // The loading indicator will be automatically replaced when the chart is initialized
      }
      
      function showErrorMessage(containerId, dataType) {
        const container = document.getElementById(containerId);
        if (container) {
          container.innerHTML = `
            <div style="
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              height: 100%;
              font-family: Arial, sans-serif;
              color: #e74c3c;
              background-color: #fdf2f2;
              border-radius: 8px;
              border: 1px solid #f8d7da;
            ">
              <div style="
                font-size: 18px;
                margin-bottom: 10px;
                font-weight: bold;
              ">Failed to load ${dataType} data</div>
              <div style="
                font-size: 14px;
                color: #721c24;
                text-align: center;
              ">Please try refreshing the page</div>
            </div>
          `;
        }
      }

      // Backward compatibility functions (deprecated)
      function showSpeciesLoadingIndicator() {
        showLoadingIndicator('speciesProgressContainer');
      }
      
      function hideSpeciesLoadingIndicator() {
        hideLoadingIndicator('speciesProgressContainer');
      }
      
      function showSpeciesErrorMessage() {
        showErrorMessage('speciesProgressContainer', 'species');
      }

      // Function to update year dropdown displays
      function updateYearDropdowns() {
        const allSelectBoxes = document.querySelectorAll('.select-box');
        const startYearBox = allSelectBoxes[1]; // Second dropdown (Start Year)
        const endYearBox = allSelectBoxes[2];   // Third dropdown (End Year)
        if (startYearBox) startYearBox.textContent = startYear;
        if (endYearBox) endYearBox.textContent = endYear;
      }

      // Function to find the first year with non-zero counts for a specific data type
      function findOptimalStartYearForData(data, dataType) {
        // Data from services.js is already filtered to 2010-2025
        const dataStartYear = 2010;
        
        // Get the effective start year based on user selection
        const effectiveStartYear = getEffectiveStartYear(dataType);
        
        if (!data || !data.series || data.series.length === 0) {
          console.log(`No data available for ${dataType}, using effective start year: ${effectiveStartYear}`);
          return effectiveStartYear;
        }
        
        // Find the first year where this data type has non-zero counts, starting from effective start year
        for (let year = effectiveStartYear; year <= endYear; year++) {
          const yearIndex = year - dataStartYear;
          
          // Check if this year index exists in the data and has non-zero values
          for (let series of data.series) {
            if (series.data && 
                yearIndex < series.data.length && 
                series.data[yearIndex] && 
                series.data[yearIndex] > 0) {
              console.log(`${dataType} optimal start year found: ${year} (first non-zero data)`);
              return year;
            }
          }
        }
        
        console.log(`${dataType} using effective start year: ${effectiveStartYear} (no non-zero data found)`);
        return effectiveStartYear;
      }

      // Function to find the optimal start year (takes the later of family and species start years)
      function findOptimalStartYear() {
        // Check if both data sets are available
        if (!familyDataMap[activeType] || !speciesDataMap[activeType]) {
          return 2004; // Use family start year as default since it's later
        }
        
        const familyStartYear = findOptimalStartYearForData(familyDataMap[activeType], 'Family');
        const speciesStartYear = findOptimalStartYearForData(speciesDataMap[activeType], 'Species');
        
        // Use the later of the two start years to ensure both charts have meaningful data
        const optimalStartYear = Math.max(familyStartYear, speciesStartYear);
        console.log(`Combined optimal start year: ${optimalStartYear} (Family: ${familyStartYear}, Species: ${speciesStartYear})`);
        
        return optimalStartYear;
      }

      // Function to trim series data to match the user's selected year range
      function trimSeriesToStartYear(series, startYear, containerId) {
        // Data from services.js is already filtered to 2010-2025
        const dataStartYear = 2010;
        const skipYears = startYear - dataStartYear;
        
        console.log(`Trimming ${containerId}: dataStartYear=${dataStartYear}, userStartYear=${startYear}, skipYears=${skipYears}`);
        
        // Only skip years if the user wants to start later than 2010
        if (skipYears > 0) {
          return series.map(s => ({
            ...s,
            data: s.data.slice(skipYears) // Remove data points before the user's start year
          }));
        } else {
          // If user wants to start from 2010 or earlier, return original series
          return series;
        }
      }

      function initEchart(data, containerId, yLabel) {
        const chartDom = document.getElementById(containerId);
        const myChart = echarts.init(chartDom);

        // Determine optimal start year for this specific chart
        const dataType = containerId === 'familyProgressContainer' ? 'Family' : 'Species';
        const chartStartYear = findOptimalStartYearForData(data, dataType);
        
        console.log(`${dataType} chart using start year: ${chartStartYear}, end year: ${endYear}`);
        
        // Generate year range from optimal start year to selected end year
        const yearRange = Array.from({length: endYear - chartStartYear + 1}, (_, i) => chartStartYear + i);

        // Trim series data to match the optimal start year
        const trimmedSeries = trimSeriesToStartYear(data.series, chartStartYear, containerId);

        // Apply consistent ordering and colors to series data using helper function
        const seriesWithColors = applyConsistentOrdering(trimmedSeries, containerId);

        // Get the actual order of categories from the reordered series
        const actualOrder = seriesWithColors.map(series => series.name);
        
        // Use the same order for legend as the reordered series (contig before chromosome for species chart)
        const legendOrder = [...actualOrder];
        
        // Define consistent color mapping for the color array
        const assemblyLevelColors = {
          'contig': '#ffff33',        // yellow
          'scaffold': '#22a884',     // teal
          'chromosome': '#404387',   // dark blue
          'complete genome': '#7ad151' // green
        };
        
        // Create colors array in the same order as the reordered series
        const orderedColors = actualOrder.map(name => assemblyLevelColors[name] || '#cccccc');

        const option = {
          legend: {
            show: true,
            selectedMode: false,
            data: legendOrder, // Use custom legend order for species chart
            textStyle: {
              color: '#000',
              fontSize: 12,
              fontWeight: 'bold',
            }
          },
          color: orderedColors, // Use consistent colors in the right order
          grid: {
            left: '7%',  // Decreased left margin
            right: '2%',
            bottom: '3%',
            containLabel: true
          },
          yAxis: {
            type: "value",
            name: yLabel,
            nameLocation: 'middle',
            nameRotate: 90,
            nameGap: 45,  // Adjust gap to bring label closer
            nameTextStyle: {
              fontWeight: 'bold',
              fontSize: 14,
            },
            axisLine: {
              show: true,
              lineStyle: {
                color: "#000",
                width: 1,
              },
            },
            axisLabel: {
              show: true,
              color: "#000",
              fontSize: 12,
              margin: 5, // Move labels closer to the axis
            },
            splitLine: {
              show: true,
              lineStyle: {
                color: '#ccc'
              }
            },
          },
          xAxis: {
            type: "category",
            data: yearRange, // Use dynamic year range based on data
            axisLine: {
              show: true,
              lineStyle: {
                color: "#000",
                width: 1,
              },
            },
            axisLabel: {
              show: true,
              color: "#000",
              fontSize: 12,
              interval: function(index, value) {
                // Show label only if the year is even (2006, 2008, 2010, etc.)
                return parseInt(value) % 2 === 0;
              },
              rotate: 0,  // Rotate labels for better readability
            },
            splitLine: {
              show: false,
            },
          },
          tooltip: {
            trigger: "axis",
            position: function (point, params, dom, rect, size) {
              // Get the chart container width
              var chartWidth = size.viewSize[0];
              var tooltipWidth = size.contentSize[0];
              var tooltipHeight = size.contentSize[1];
              
              // Position tooltip on the right side of the chart
              // If there's enough space on the right, position it there
              // Otherwise, position it on the left side of the mouse
              var x = point[0] + 20; // 20px offset from mouse
              if (x + tooltipWidth > chartWidth) {
                x = point[0] - tooltipWidth - 20; // Position on left if not enough space on right
              }
              
              // Keep tooltip within vertical bounds
              var y = point[1] - tooltipHeight / 2;
              if (y < 0) y = 0;
              if (y + tooltipHeight > size.viewSize[1]) y = size.viewSize[1] - tooltipHeight;
              
              return [x, y];
            },
            formatter: function (params) {
              // For total calculation
              if (!activeType.includes('YoY Growth')) {
                var categoryMap = {};
                params.forEach(function (item) {
                  var category = item.name;
                  var value = item.value;

                  if (!categoryMap[category]) {
                    categoryMap[category] = 0;
                  }

                  categoryMap[category] += value;
                });

                var totalStr = "";
                for (var category in categoryMap) {
                  totalStr += "Total (" + category + "): " + categoryMap[category].toLocaleString() + "<br/>";
                }

                var res = params
                  .map(function (item) {
                    return item.seriesName + ": " + item.value.toLocaleString();
                  })
                  .join("<br/>");

                return totalStr + res;
              }

              var res = params
                .map(function (item) {
                  return item.seriesName + ": " + item.value.toLocaleString() + (activeType.includes('YoY Growth') ? '%' : '');
                })
                .join("<br/>");

              return res;
            },
          },
          series: seriesWithColors, // Use series with consistent colors
        };
        myChart.setOption(option);
      
        return myChart
      }

       // JavaScript to handle dropdown functionality
    document.querySelectorAll('.select-box').forEach(selectBox => {
      selectBox.addEventListener('click', function() {
        const select = this.parentElement;
        select.classList.toggle('active');
      });
    });

    document.querySelectorAll('.option').forEach(option => {
      option.addEventListener('click', function() {
        const selectBox = option.parentElement.previousElementSibling;
        const selectContainer = option.parentElement.parentElement;
        selectBox.textContent = option.textContent;
        selectContainer.classList.remove('active');
        
        // Determine which dropdown was clicked based on the select container
        const optionsCount = selectContainer.querySelector('.options-container').children.length;
        
        if (optionsCount === 3) {
          // Data type dropdown (Cumulative, Actual, YoY Growth)
          checkoutChart(option.textContent);
        } else if (optionsCount === 16) {
          // Year dropdown - determine if it's start or end year based on position
          const allSelectGroups = document.querySelectorAll('.select-group');
          const clickedSelectGroup = selectContainer.parentElement;
          
          if (clickedSelectGroup === allSelectGroups[1]) {
            // Start Year dropdown
            checkoutStartYear(option.textContent);
          } else if (clickedSelectGroup === allSelectGroups[2]) {
            // End Year dropdown
            checkoutEndYear(option.textContent);
          }
        }
      });
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', function(event) {
      const selects = document.querySelectorAll('.custom-select');
      selects.forEach(select => {
        if (!select.contains(event.target)) {
          select.classList.remove('active');
        }
      });
    });

    // Add copyright notice with fallback
    try {
      const copyrightElement = document.getElementById('copyright');
      if (window.copyright && window.copyright.notice) {
        copyrightElement.textContent = copyright.notice;
      }
    } catch (e) {
      console.warn('Copyright configuration not loaded:', e);
    }



    window.addEventListener('resize', function() {
      if (familyChart) familyChart.resize();
      if (speciesChart) speciesChart.resize();
    });
    </script>
  </body>
